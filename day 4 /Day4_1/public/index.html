<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIP Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>SIP Calculator</h1>

    <form id="sip-form">
      <label>
        Monthly Investment (₹)
        <input type="number" id="monthlyInvestment" min="1" step="1" value="5000" required />
      </label>

      <label>
        Expected Annual Return (%)
        <input type="number" id="annualReturnRate" min="0" step="0.1" value="12" required />
      </label>

      <label>
        Investment Duration (years)
        <input type="number" id="years" min="1" step="1" value="10" required />
      </label>

      <button type="submit">Calculate</button>
    </form>

    <section id="result" class="result hidden">
      <div class="result-row">
        <span>Invested Amount</span>
        <strong id="investedAmount"></strong>
      </div>
      <div class="result-row">
        <span>Estimated Returns</span>
        <strong id="estimatedReturns"></strong>
      </div>
      <div class="result-row total">
        <span>Total Value</span>
        <strong id="futureValue"></strong>
      </div>
    </section>

    <p id="error" class="error hidden"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
