services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qh
      POSTGRES_PASSWORD: qh
      POSTGRES_DB: qualified_health
    ports:
      - "5432:5432"
    volumes:
      - qh_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qh -d qualified_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://qh:qh@postgres:5432/qualified_health
      AIDLC_API_KEY: ${AIDLC_API_KEY:-dev-local-key}
      AIDLC_CORS_ORIGINS: ${AIDLC_CORS_ORIGINS:-http://localhost:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CLAUDE_PROJECT_DIR: /app
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-qualified-health-backend}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  qh_pgdata:
